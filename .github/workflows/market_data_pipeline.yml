name: MANTRA Market Data Ingestion & Analytics

on:
  schedule:
    # Runs the pipeline every hour on the hour, Monday through Friday
    - cron: '0 * * * 1-5'
  workflow_dispatch:
    # Allows manual triggering of the pipeline via the GitHub Actions user interface

jobs:
  ingest-process-and-predict:
    runs-on: ubuntu-latest
    
    # Grants write permissions to the repository's contents to allow committing updated data and charts
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetches the full history to prevent rebase conflicts during pushes

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Leverages caching of pip dependencies for accelerated subsequent runs

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Data Ingestion for Market Assets
      env:
        IDENTIFIER: ${{ secrets.IDENTIFIER }}
        PASSWORD: ${{ secrets.PASSWORD }}
        X_CAP_API_KEY: ${{ secrets.X_CAP_API_KEY }}
      run: |
        # Sequentially fetch 1-minute historical data streams into data/raw/
        python src/data_ingestion.py --epic OIL_CRUDE
        python src/data_ingestion.py --epic GOLD
        python src/data_ingestion.py --epic US500

    - name: Execute Data Processing and Visualization
      run: |
        # Merges asynchronous asset tickers from data/raw/ into a master CSV in data/processed/
        python src/data_processing.py

    - name: Execute Machine Learning Anomaly Detection
      run: |
        # Computes mathematical returns and applies unsupervised Isolation Forest to flag shocks
        python src/anomaly_detection.py

    - name: Commit and Push Updated Data & Graphics
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # 1. Stage the data directory first to clear the "unstaged changes" state
        git add data/
        
        # 2. Check if any actual data changes or new plots are staged for commit
        if git diff --staged --quiet; then
          echo "⚠️ No new market variations or artifacts detected. Skipping commit."
        else
          # 3. Commit locally to keep the working directory completely clean
          git commit -m "📊 Automated pipeline run: Master CSV, ML Features & Anomaly Reports updated"
          
          # 4. Pull remote changes safely; your local commit will be replayed on top
          git pull origin main --rebase
          
          # 5. Push the final synchronized state back to GitHub
          git push origin main
          echo "✅ Asset features synchronized and machine learning reports pushed successfully to main branch."
        fi
