name: MANTRA AI Risk Agents Committee

on:
  workflow_run:
    workflows: ["MANTRA Market Analytics & ML"]
    types:
      - completed
  workflow_dispatch: # Allows manual triggering anytime

jobs:
  agentic-risk-briefing:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Agentic AI Risk Committee Analysis
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        # Triggers CrewAI workflow where Gemini agents process JSON logs into a markdown executive brief
        python src/agent_orchestrator.py

    - name: Commit and Push Executive Risk Briefing
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Stage the markdown report generated by the Chief Risk Officer
        git add data/analyzed/risk_committee_report.md
        
        if git diff --staged --quiet; then
          echo "⚠️ No changes in executive risk briefings detected."
        else
          git commit -m "🤖 AI Agent Sync: Executive risk committee briefings updated"
          git pull origin main --rebase
          git push origin main
          echo "✅ Executive C-suite risk briefing successfully published to repository."
        fi
