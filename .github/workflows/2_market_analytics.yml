name: MANTRA Market Analytics & ML

on:
  workflow_run:
    workflows: ["MANTRA Market Data Ingestion"]
    types:
      - completed
  workflow_dispatch: # Allows manual triggering anytime

jobs:
  machine-learning:
    # Trigger only if the ingestion workflow succeeded OR if triggered manually
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Machine Learning Anomaly Detection
      run: |
        # Computes mathematical returns and applies unsupervised Isolation Forest to flag shocks
        python src/anomaly_detection.py

    - name: Commit and Push ML Artifacts
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # --- FIXED: Now tracks and stages the new analyzed gold-layer directory ---
        git add data/analyzed/
        
        if git diff --staged --quiet; then
          echo "⚠️ No new ML insights or dashboard updates detected."
        else
          git commit -m "🧠 ML Gold Layer Sync: Diagnostic dashboard and analyzed data vectors updated"
          git pull origin main --rebase
          git push origin main
          echo "✅ Advanced machine learning artifacts successfully synchronized with analyzed layer."
        fi
