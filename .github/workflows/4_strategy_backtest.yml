name: MANTRA Quantitative Strategy Backtest

on:
  workflow_run:
    #workflows: ["MANTRA Market Analytics & ML"]
    #types:
     # - completed
 # workflow_dispatch: # Allows manual triggering anytime

jobs:
  execute-backtest:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Multi-Strategy Backtest Simulator
      run: |
        # Executes the backtest and targets the new data/backtest_results directory
        python src/backtest_engine.py

    - name: Publish Performance to GitHub Summary
      run: |
        # Inject the report from the new path into the GitHub Actions UI
        cat data/backtest_results/backtest_performance.md >> $GITHUB_STEP_SUMMARY

    - name: Commit and Push Strategy Artifacts
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Track and stage the new dedicated backtest directory
        git add data/backtest_results/
        
        if git diff --staged --quiet; then
          echo "⚠️ No changes in quantitative strategy returns detected."
        else
          git commit -m "📊 Quantitative Strategy Sync: Backtest results repository updated [Skip CI]"
          git pull origin main --rebase
          git push origin main
          echo "✅ Backtest simulation ledger successfully synced with repository."
        fi
