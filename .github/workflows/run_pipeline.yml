name: MANTRA Market Data Ingestion & Analytics

on:
  schedule:
    # Runs the pipeline every hour on the hour, Monday through Friday
    - cron: '0 * * * 1-5'
  workflow_dispatch:
    # Allows manual triggering of the pipeline via the GitHub Actions user interface

jobs:
  ingest-and-process:
    runs-on: ubuntu-latest
    
    # Grants write permissions to the repository's contents to allow committing updated data and charts
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetches the full history to prevent rebase conflicts during pushes

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Leverages caching of pip dependencies for accelerated subsequent runs

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Data Ingestion for Market Assets
      env:
        IDENTIFIER: ${{ secrets.IDENTIFIER }}
        PASSWORD: ${{ secrets.PASSWORD }}
        X_CAP_API_KEY: ${{ secrets.X_CAP_API_KEY }}
      run: |
        # Sequentially fetch 1-minute historical data streams for target asset classes
        python src/data_ingestion.py --epic OIL_CRUDE
        python src/data_ingestion.py --epic GOLD
        python src/data_ingestion.py --epic US500

    - name: Execute Data Processing and Visualization
      run: |
        # Merges asynchronous asset tickers into a single master CSV and renders the trend plot
        python src/data_processing.py

    - name: Commit and Push Updated Data & Graphics
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Pull latest changes from remote using rebase to maintain a linear commit history
        git pull origin main --rebase
        
        # Stage the entire data folder containing updated data feeds and analytics graphics
        git add data/
        
        # Verify if actual differences exist before initiating a commit to prevent empty pipeline noise
        if git diff --quiet && git diff --staged --quiet; then
          echo "⚠️ No new market variations or artifacts detected. Skipping commit."
        else
          git commit -m "📊 Automated pipeline run: Master CSV & Trend Analytics updated"
          git push origin main
          echo "✅ Asset parameters synchronized and multi-panel charts pushed successfully to main branch."
        fi
